services:
  postgres:
    image: postgres:16
    container_name: depot-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"            # your PC's port 5432 → the container's port 5432
    volumes:
      - pgdata:/var/lib/postgresql/data   # data survives restarts/rebuilds
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: depot-redis
    ports:
      - "6379:6379"
    # No persistence: Redis holds order ids only; the worker rebuilds the queue from Postgres.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
