services:
  postgres:
    image: postgres:16
    container_name: depot-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"            # your PC's port 5432 → the container's port 5432
    volumes:
      - pgdata:/var/lib/postgresql/data   # data survives restarts/rebuilds
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
