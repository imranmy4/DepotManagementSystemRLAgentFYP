# Central configuration for the depot RL agent (the single training setup).
# Edit values here instead of in the Python files. Any key you omit falls back to
# the dataclass default. Override any value on the CLI, e.g.:
#     python training/train.py --w_reshuffle 4 --total_timesteps 2000000

[depot]
n_blocks = 6
block_rows = 2
n_bays   = 4
n_rows   = 4
n_tiers  = 6
n_ticks  = 30
max_in   = 10
max_out  = 10
# Varied conditions per episode: fill 0-95%, ages long-tailed (mean 29, median ~20, max 90
# days) and sorted per stack oldest at the bottom; inbound/outbound caps each shifted by up to ±3.
warmstart          = 0.0
warmstart_max      = 0.95
warmstart_aged     = 0.0
warmstart_age_mean = 29
warmstart_age_max  = 90
demand_jitter      = 3

[reward]
w_burial            = 2.0
burial_cap          = 5
w_dwell             = 0.3
w_reshuffle         = 3.0
reshuffle_mult_same     = 1.0
reshuffle_mult_adjacent = 2.0
reshuffle_mult_far      = 3.0
w_cliff             = 15.0
cliff_tol           = 1
w_mean_idle         = 0.2
w_travel            = 0.3

[train]
total_timesteps = 10000000
n_envs          = 14
device          = cpu
torch_threads   = 4
learning_rate   = 1e-4
n_steps         = 1024
batch_size      = 256
n_epochs        = 5
gamma           = 0.99
gae_lambda      = 0.95
clip_range      = 0.2
ent_coef        = 0.01
net_arch        = 256,256
target_kl       = 0.03
vf_coef         = 1.0
seed            = 0
policy          = slot
slot_hidden     = 64

; n_envs 14 to utilize almost all CPU cores, but not all to avoid OOM errors. Adjust as needed.
; n_steps lowered from 2048 to 1024 to reduce memory usage, which also reduces the variance of updates and can help with stability.
; w_dwell             = 1.0
; w_reshuffle         = 1.0
; w_burial            = 0.5